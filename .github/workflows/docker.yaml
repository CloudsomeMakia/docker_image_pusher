name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]


env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"
  IMAGE_PUSH_WEBHOOK_URL: "${{ secrets.IMAGE_PUSH_WEBHOOK_URL }}"
  IMAGE_PUSH_WEBHOOK_AUTHORIZATION: "${{ secrets.IMAGE_PUSH_WEBHOOK_AUTHORIZATION }}"

jobs:

  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    # 不再用 maximize-build-space 把根盘抽干给 /var/lib/docker。
    # 上次将 root-reserve-mb 调到 10240 后，hosted runner 仍在写
    # /home/runner/actions-runner/cached/.../_diag 时出现 No space left on device。
    # 默认根盘可用空间加上逐张 rmi 即可；保留磁盘打印便于核对。
    - name: Free up disk space complete
      run: |
        echo "Free up disk space complete"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push image Aliyun and notify
      run: bash scripts/push_images_and_notify.sh
